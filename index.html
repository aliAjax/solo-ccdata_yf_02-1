<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas Room · 离线协作白板</title>
<style>
:root{--ink:#17212b;--muted:#6d7b88;--line:#dbe2e8;--bg:#f5f8fa;--blue:#276ef1;--green:#44a57b}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 11px;border-radius:7px;cursor:pointer;font:inherit;white-space:nowrap}
button:hover{border-color:var(--blue);color:var(--blue)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:default;pointer-events:none}
.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.primary:hover{color:#fff;filter:brightness(1.08)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line)}
.logo{font-size:17px;font-weight:800;display:flex;gap:9px;align-items:center}
.dot{width:28px;height:28px;background:var(--blue);border-radius:8px;color:#fff;display:grid;place-items:center;font-size:14px}
.room{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--muted);font-size:13px}
.room b{color:var(--ink);letter-spacing:.05em}
.room button{padding:3px 8px;font-size:12px}
.topbar .actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta{font-size:12px;color:var(--muted)}
#syncStatus{color:var(--green);transition:color .3s}
.toolbar{display:flex;align-items:center;gap:6px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0}
.tool[aria-pressed="true"]{background:#e9f0ff;color:var(--blue);border-color:#9ebaff}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex-shrink:0}
.color button{width:24px;height:24px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.color button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--blue)}
.hint{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.board-scroll{flex:1;overflow:auto;background:var(--bg)}
.board{position:relative;width:2400px;height:1600px}
#svg{display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#svg.create{cursor:crosshair}
#editor{position:absolute;z-index:5;border:2px solid var(--blue);border-radius:6px;padding:8px;font:14px Inter,system-ui,sans-serif;resize:none;background:#fff;box-shadow:0 6px 20px #24364a22}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:50;font-size:13px;box-shadow:0 6px 20px #0004}
.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:11px;background:#fff}
@media(max-width:760px){
  .topbar{padding:8px 10px;gap:8px}
  .logo{font-size:15px}
  .topbar .actions{margin-left:0;width:100%}
  .hint{display:none}
  .board-scroll{min-height:55vh}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><div class="dot">C</div>Canvas Room</div>
  <div class="room">房间 <b id="roomLabel">…</b>
    <button id="copyBtn" title="复制带房间号的链接">复制链接</button>
    <button id="newRoomBtn" title="创建新房间">新房间</button>
  </div>
  <div class="actions">
    <span class="meta" id="presence" title="同一浏览器中打开此房间的标签页数">1 个标签页在线</span>
    <span class="meta" id="syncStatus" role="status">● 已同步</span>
    <button id="undoBtn" title="撤销 (Ctrl+Z)">↶ 撤销</button>
    <button id="redoBtn" title="重做 (Ctrl+Shift+Z)">↷ 重做</button>
    <button id="exportBtn" class="primary" title="导出画布内容为 PNG (Ctrl+E)">导出 PNG</button>
  </div>
</header>
<div class="toolbar" role="toolbar" aria-label="绘图工具">
  <button class="tool" data-tool="select" aria-pressed="true" title="选择/移动 (V)">↖ 选择</button>
  <button class="tool" data-tool="note" aria-pressed="false" title="便签 (N)">▤ 便签</button>
  <button class="tool" data-tool="text" aria-pressed="false" title="文本 (T)">T 文本</button>
  <button class="tool" data-tool="rect" aria-pressed="false" title="矩形 (R)">□ 矩形</button>
  <button class="tool" data-tool="circle" aria-pressed="false" title="圆形 (C)">○ 圆形</button>
  <button class="tool" data-tool="line" aria-pressed="false" title="连线：在画布上拖拽 (L)">╱ 连线</button>
  <span class="sep"></span>
  <span class="color" role="group" aria-label="便签颜色">
    <button data-c="yellow" style="background:#fff3bf" aria-pressed="true" aria-label="黄色"></button>
    <button data-c="blue" style="background:#dff3ff" aria-pressed="false" aria-label="蓝色"></button>
    <button data-c="pink" style="background:#ffe0eb" aria-pressed="false" aria-label="粉色"></button>
  </span>
  <span class="hint">双击编辑 · <span class="kbd">Delete</span> 删除 · <span class="kbd">Ctrl+Z</span> 撤销 · 方向键微调</span>
</div>
<div class="board-scroll" id="scroll">
  <div class="board" id="board">
    <svg id="svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="application" aria-label="白板画布" tabindex="0" font-family="Inter, system-ui, sans-serif">
      <defs>
        <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1.5" cy="1.5" r="1" fill="#d7dee6"></circle>
        </pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#667484"></path>
        </marker>
        <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#24364a" flood-opacity="0.16"></feDropShadow>
        </filter>
      </defs>
      <rect x="0" y="0" width="2400" height="1600" fill="#fbfcfd"></rect>
      <rect x="0" y="0" width="2400" height="1600" fill="url(#grid)"></rect>
      <g id="layer"></g>
      <g id="previewLayer"></g>
      <g id="selLayer" pointer-events="none"></g>
    </svg>
    <textarea id="editor" hidden aria-label="编辑文本"></textarea>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(16).slice(2);
const clone=o=>JSON.parse(JSON.stringify(o));
const NOTE_COLORS={yellow:'#fff3bf',blue:'#dff3ff',pink:'#ffe0eb'};
const WORLD={w:2400,h:1600};
const svg=$('#svg'),layer=$('#layer'),selLayer=$('#selLayer'),previewLayer=$('#previewLayer');
const editor=$('#editor'),toast=$('#toast');
const NS='http://www.w3.org/2000/svg';
const measureCtx=document.createElement('canvas').getContext('2d');
function el(name,attrs,parent){const e=document.createElementNS(NS,name);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function toastMsg(t){toast.textContent=t;toast.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>toast.style.display='none',1800);}
function roomCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const c=crypto.getRandomValues(new Uint8Array(6));let s='';for(let i=0;i<6;i++)s+=a[c[i]%a.length];return s;}

/* ================= 状态与持久化 ================= */
let roomId,state,bc;
const tabId=sessionStorage.tabId||(sessionStorage.tabId=uid());
const peers=new Map();
function loadState(id){
  try{const raw=localStorage.getItem('room:'+id);
    if(raw){const d=JSON.parse(raw);return{objects:d.objects||{},order:d.order||[],applied:new Set(d.applied||[])};}
  }catch(e){}
  return{objects:{},order:[],applied:new Set()};
}
function save(){
  try{localStorage.setItem('room:'+roomId,JSON.stringify({
    objects:state.objects,order:state.order,applied:[...state.applied].slice(-800)
  }));}catch(e){}
}

/* ================= 事件应用（幂等） ================= */
function mutate(ev){
  if(ev.kind==='add'){
    if(!state.objects[ev.obj.id]){state.objects[ev.obj.id]=clone(ev.obj);state.order.push(ev.obj.id);}
  }else if(ev.kind==='remove'){
    delete state.objects[ev.objId];
    state.order=state.order.filter(i=>i!==ev.objId);
    if(selectedId===ev.objId)select(null);
  }else if(ev.kind==='set'){
    const o=state.objects[ev.objId];
    if(o)Object.assign(o,ev.patch);
  }
}
function applyEvent(ev){
  if(!ev||!ev.id||state.applied.has(ev.id))return false;   // 重复事件不重复应用
  state.applied.add(ev.id);
  if(state.applied.size>1200)state.applied=new Set([...state.applied].slice(-800));
  mutate(ev);save();render();
  return true;
}
function broadcast(ev){
  if(bc)try{bc.postMessage({t:'ev',ev});}catch(e){}
  try{localStorage.setItem('sync:'+roomId,JSON.stringify({ev,n:uid()}));}catch(e){} // storage 事件兜底通道
}
function flashSync(){
  const s=$('#syncStatus');s.textContent='● 已同步 · 刚刚更新';
  clearTimeout(s._t);s._t=setTimeout(()=>s.textContent='● 已同步',1500);
}

/* ================= 撤销 / 重做（命令模式，撤销本身也是新事件，可同步） ================= */
const undoStack=[],redoStack=[];
const stripEv=ev=>{const e={...ev};delete e.id;delete e.ts;return e;};
/* 冲突守卫：记录操作生效后对象应处的状态。执行撤销/重做前校验，
   若对象已被其他标签更新（状态不再匹配），该条目过期——丢弃而不是覆盖较新版本。 */
function guardOf(ev){
  if(ev.kind==='add')return{objId:ev.obj.id,expect:clone(ev.obj)};
  if(ev.kind==='remove')return{objId:ev.objId,absent:true};
  return{objId:ev.objId,expect:{...ev.patch}};
}
function guardOK(g){
  const o=state.objects[g.objId];
  if(g.absent)return!o;
  if(!o)return false;
  return Object.keys(g.expect).every(k=>o[k]===g.expect[k]);
}
function commit(doEv,undoEv,label,mergeKey){
  const now=Date.now(),top=undoStack[undoStack.length-1];
  /* 合并连续微调的前提：栈顶条目的守卫仍成立（上次微调后对象未被远端更新），
     否则另起新条目——旧快照立即过期，撤销不会把远端位置回退到最初值。 */
  const canMerge=!!(mergeKey&&top&&top.mergeKey===mergeKey&&now-top.time<900&&guardOK(top.undoGuard));
  const ev={...doEv,id:uid(),ts:Date.now()};
  applyEvent(ev);broadcast(ev);
  if(canMerge){
    top.redoEv=stripEv(ev);top.undoGuard=guardOf(ev);top.time=now;
  }else{
    undoStack.push({label,mergeKey,time:now,redoEv:stripEv(ev),undoEv,
                    undoGuard:guardOf(ev),redoGuard:guardOf(undoEv)});
    if(undoStack.length>200)undoStack.shift();
  }
  redoStack.length=0;updateUndoUI();
}
function undo(){
  const c=undoStack.pop();if(!c)return;
  if(!guardOK(c.undoGuard)){updateUndoUI();toastMsg('已跳过过期撤销：'+c.label+'（对象已被其他标签页更新）');return;}
  const ev={...c.undoEv,id:uid(),ts:Date.now()};
  applyEvent(ev);broadcast(ev);redoStack.push(c);updateUndoUI();toastMsg('已撤销：'+c.label);
}
function redo(){
  const c=redoStack.pop();if(!c)return;
  if(!guardOK(c.redoGuard)){updateUndoUI();toastMsg('已跳过过期重做：'+c.label+'（对象已被其他标签页更新）');return;}
  const ev={...c.redoEv,id:uid(),ts:Date.now()};
  applyEvent(ev);broadcast(ev);undoStack.push(c);updateUndoUI();toastMsg('已重做：'+c.label);
}
function updateUndoUI(){
  $('#undoBtn').disabled=!undoStack.length;
  $('#redoBtn').disabled=!redoStack.length;
}
/* 常用命令 */
const addObject=o=>commit({kind:'add',obj:o},{kind:'remove',objId:o.id},'添加'+typeName(o.type));
const removeObject=o=>commit({kind:'remove',objId:o.id},{kind:'add',obj:clone(o)},'删除'+typeName(o.type));
function setPatch(o,patch,label,mergeKey){
  const before={};for(const k in patch)before[k]=o[k];
  commit({kind:'set',objId:o.id,patch},{kind:'set',objId:o.id,patch:before},label||'修改',mergeKey);
}
function typeName(t){return{note:'便签',text:'文本',rect:'矩形',circle:'圆形',line:'连线'}[t]||'元素';}

/* ================= 文本排版 ================= */
function wrapText(text,maxW,font){
  measureCtx.font=font;
  const out=[];
  for(const raw of String(text).split('\n')){
    if(!raw){out.push('');continue;}
    let line='';
    for(const ch of raw){
      if(measureCtx.measureText(line+ch).width>maxW&&line){out.push(line);line=ch;}
      else line+=ch;
    }
    out.push(line);
  }
  return out;
}
function noteLines(o){return wrapText(o.text||'双击编辑内容',o.w-28,'14px Inter, system-ui, sans-serif');}
function noteHeight(o){return Math.max(80,noteLines(o).length*20+34);}
function textSize(o){
  const lines=wrapText(o.text||'双击编辑文本',560,'16px Inter, system-ui, sans-serif');
  measureCtx.font='16px Inter, system-ui, sans-serif';
  const w=Math.max(40,...lines.map(l=>measureCtx.measureText(l||' ').width))+6;
  return{lines,w:Math.ceil(w),h:lines.length*22+8};
}

/* ================= 渲染 ================= */
function objBBox(o){
  if(o.type==='line'){return{x:Math.min(o.x,o.x2)-6,y:Math.min(o.y,o.y2)-6,w:Math.abs(o.x2-o.x)+12,h:Math.abs(o.y2-o.y)+12};}
  return{x:o.x,y:o.y,w:o.w,h:o.h};
}
function drawTextLines(g,lines,x,y,lineH,fontSize,fill,anchor,weight){
  const t=el('text',{x,y,'font-size':fontSize,fill,'text-anchor':anchor||'start',style:'white-space:pre'+(weight?';font-weight:'+weight:'')},g);
  lines.forEach((ln,i)=>{const ts=el('tspan',{x,dy:i===0?0:lineH},t);ts.textContent=ln||' ';});
  return t;
}
function drawObject(parent,o){
  const g=el('g',{'data-oid':o.id,style:'cursor:move'},parent);
  if(o.type==='note'){
    el('rect',{x:o.x,y:o.y,width:o.w,height:o.h,rx:4,fill:NOTE_COLORS[o.color]||NOTE_COLORS.yellow,filter:'url(#sh)'},g);
    drawTextLines(g,noteLines(o),o.x+14,o.y+26,20,14,o.text?'#17212b':'#8a97a3');
  }else if(o.type==='text'){
    const{lines}=textSize(o);
    el('rect',{x:o.x-4,y:o.y-4,width:o.w+8,height:o.h+8,fill:'transparent'},g);
    drawTextLines(g,lines,o.x,o.y+17,22,16,o.text?'#17212b':'#8a97a3');
  }else if(o.type==='rect'){
    el('rect',{x:o.x,y:o.y,width:o.w,height:o.h,rx:12,fill:'#e9f0ff',stroke:'#276ef1','stroke-width':3},g);
    if(o.text)drawTextLines(g,wrapText(o.text,o.w-16,'13px Inter, system-ui, sans-serif').slice(0,3),o.x+o.w/2,o.y+o.h/2-4,16,13,'#17212b','middle');
  }else if(o.type==='circle'){
    el('ellipse',{cx:o.x+o.w/2,cy:o.y+o.h/2,rx:o.w/2,ry:o.h/2,fill:'#e9f0ff',stroke:'#276ef1','stroke-width':3},g);
    if(o.text)drawTextLines(g,wrapText(o.text,o.w-20,'13px Inter, system-ui, sans-serif').slice(0,3),o.x+o.w/2,o.y+o.h/2-4,16,13,'#17212b','middle');
  }else if(o.type==='line'){
    el('line',{x1:o.x,y1:o.y,x2:o.x2,y2:o.y2,stroke:'transparent','stroke-width':16},g);
    el('line',{x1:o.x,y1:o.y,x2:o.x2,y2:o.y2,stroke:'#667484','stroke-width':2.5,'marker-end':'url(#arrow)'},g);
    if(o.text)el('text',{x:(o.x+o.x2)/2,y:(o.y+o.y2)/2-8,'font-size':13,fill:'#17212b','text-anchor':'middle',stroke:'#fbfcfd','stroke-width':4,'paint-order':'stroke'},g).textContent=o.text;
  }
  return g;
}
function renderSelection(){
  selLayer.textContent='';
  if(selectedId&&state.objects[selectedId]){
    const b=objBBox(state.objects[selectedId]);
    el('rect',{x:b.x-5,y:b.y-5,width:b.w+10,height:b.h+10,fill:'none',stroke:'#276ef1','stroke-width':1.5,'stroke-dasharray':'6 4',rx:4},selLayer);
  }
}
function render(){
  layer.textContent='';previewLayer.textContent='';
  for(const id of state.order){const o=state.objects[id];if(o)drawObject(layer,o);}
  if(preview)drawObject(previewLayer,preview);
  renderSelection();
}

/* ================= 选择与编辑 ================= */
let selectedId=null,tool='select',noteColor='yellow',preview=null;
function select(id){
  selectedId=id;renderSelection();   // 只重绘选择层：重建对象层会毁掉 pointerdown 目标节点，导致 click/dblclick 不触发
  if(id)svg.focus({preventScroll:true});
}
function setTool(t){
  tool=t;
  document.querySelectorAll('.tool').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===t?'true':'false'));
  svg.classList.toggle('create',t!=='select');
}
function openEditor(o){
  closeEditor();
  const b=objBBox(o);
  editor.hidden=false;
  editor.style.left=b.x+'px';editor.style.top=b.y+'px';
  editor.style.width=Math.max(180,b.w)+'px';editor.style.height=Math.max(64,Math.min(b.h,220))+'px';
  editor.value=o.text||'';
  editor.dataset.oid=o.id;editor._cancel=false;
  editor._base=o.text||'';   // 打开时的文本版本，用于检测编辑期间的远端改写
  editor.focus();editor.select();
}
function closeEditor(commitIt){
  if(editor.hidden)return;
  const o=state.objects[editor.dataset.oid];
  editor.hidden=true;
  if(!commitIt||editor._cancel)return;
  const draft=editor.value.replace(/\s+$/,'');
  if(!o){if(draft&&draft!==editor._base)toastMsg('对象已被其他标签页删除，草稿未提交');return;}
  if(draft===(o.text||''))return;
  if((o.text||'')!==editor._base){
    // 编辑期间对象已被其他标签页改写：不静默提交旧草稿，由用户选择
    const overwrite=confirm('此对象已被其他标签页修改为：\n「'+(o.text||'')+'」\n\n确定 = 用你的草稿覆盖\n取消 = 丢弃草稿，保留远端内容');
    if(!overwrite){toastMsg('已丢弃草稿，保留远端内容');return;}
    toastMsg('已用草稿覆盖远端修改');
  }
  const patch={text:draft};
  if(o.type==='note')patch.h=noteHeight({...o,text:draft});
  if(o.type==='text'){const s=textSize({...o,text:draft});patch.w=s.w;patch.h=s.h;}
  setPatch(o,patch,'编辑'+typeName(o.type));
}
editor.addEventListener('keydown',e=>{
  if(e.key==='Escape'){editor._cancel=true;editor.blur();}
  else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){editor.blur();}
  e.stopPropagation();
});
editor.addEventListener('blur',()=>closeEditor(true));

/* ================= 画布交互 ================= */
function svgPoint(e){
  const r=svg.getBoundingClientRect();
  return{x:(e.clientX-r.left)*(WORLD.w/r.width),y:(e.clientY-r.top)*(WORLD.h/r.height)};
}
function defaultObject(type,p){
  const base={id:uid(),type,text:'',color:noteColor};
  if(type==='note')return{...base,x:p.x-110,y:p.y-45,w:220,h:90};
  if(type==='text'){const o={...base,x:p.x,y:p.y,text:'文本'};const s=textSize(o);return{...o,w:s.w,h:s.h,text:''};}
  if(type==='rect')return{...base,x:p.x-90,y:p.y-55,w:180,h:110};
  if(type==='circle')return{...base,x:p.x-65,y:p.y-65,w:130,h:130};
  if(type==='line')return{...base,x:p.x,y:p.y,x2:p.x+160,y2:p.y};
  return base;
}
let drag=null;
svg.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  closeEditor(true);
  const p=svgPoint(e);
  const hit=e.target.closest&&e.target.closest('[data-oid]');
  if(hit){
    const o=state.objects[hit.dataset.oid];
    if(!o)return;
    select(o.id);
    drag={mode:'move',id:o.id,sx:p.x,sy:p.y,orig:{x:o.x,y:o.y,x2:o.x2,y2:o.y2},moved:false};
  }else{
    if(tool==='select'){select(null);return;}
    preview=defaultObject(tool,p);
    drag={mode:'create',sx:p.x,sy:p.y};
    render();
  }
  // 注意：不在 pointerdown 捕获指针——捕获会把 mouseup 重定向到 svg，导致 click/dblclick 不触发
});
svg.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.captured){try{svg.setPointerCapture(e.pointerId);drag.captured=true;}catch(_){}}
  const p=svgPoint(e);
  if(drag.mode==='move'){
    const dx=p.x-drag.sx,dy=p.y-drag.sy;
    if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;
    const o=state.objects[drag.id];if(!o)return;
    o.x=drag.orig.x+dx;o.y=drag.orig.y+dy;
    if(o.type==='line'){o.x2=drag.orig.x2+dx;o.y2=drag.orig.y2+dy;}
    scheduleRender();
  }else if(drag.mode==='create'&&preview){
    const dx=p.x-drag.sx,dy=p.y-drag.sy;
    if(preview.type==='rect'||preview.type==='circle'){
      preview.x=Math.min(drag.sx,p.x);preview.y=Math.min(drag.sy,p.y);
      preview.w=Math.max(Math.abs(dx),preview.type==='circle'?20:24);
      preview.h=Math.max(Math.abs(dy),20);
    }else if(preview.type==='line'){
      preview.x2=p.x;preview.y2=p.y;
    }else{ // note/text 跟随点击点
      const d=defaultObject(preview.type,p);
      preview.x=d.x;preview.y=d.y;
    }
    scheduleRender();
  }
});
function endDrag(e){
  if(!drag)return;
  const d=drag;drag=null;
  if(d.mode==='move'){
    const o=state.objects[d.id];
    if(o&&d.moved){
      const patch={x:Math.round(o.x),y:Math.round(o.y)};
      const before={x:d.orig.x,y:d.orig.y};
      if(o.type==='line'){patch.x2=Math.round(o.x2);patch.y2=Math.round(o.y2);before.x2=d.orig.x2;before.y2=d.orig.y2;}
      commit({kind:'set',objId:o.id,patch},{kind:'set',objId:o.id,patch:before},'移动'+typeName(o.type));
    }
    // 未移动时不重绘：pointerup 与 mouseup 之间替换 DOM 会吞掉 click/dblclick
  }else if(d.mode==='create'&&preview){
    const o=preview;preview=null;
    if(o.type==='line'&&Math.hypot(o.x2-o.x,o.y2-o.y)<15){o.x2=o.x+160;o.y2=o.y;}
    o.x=Math.round(o.x);o.y=Math.round(o.y);
    if(o.x2!==undefined){o.x2=Math.round(o.x2);o.y2=Math.round(o.y2);}
    addObject(o);
    select(o.id);
    setTool('select');
    if(o.type==='note'||o.type==='text')openEditor(state.objects[o.id]);
  }
}
svg.addEventListener('pointerup',endDrag);
svg.addEventListener('pointercancel',endDrag);
svg.addEventListener('dblclick',e=>{
  const hit=e.target.closest&&e.target.closest('[data-oid]');
  if(hit){const o=state.objects[hit.dataset.oid];if(o){select(o.id);openEditor(o);}}
});
let rafPending=false;
function scheduleRender(){if(rafPending)return;rafPending=true;requestAnimationFrame(()=>{rafPending=false;render();});}

/* ================= 键盘 ================= */
window.addEventListener('keydown',e=>{
  const editing=!editor.hidden||/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement&&document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='e'){e.preventDefault();exportPNG();return;}
  if(editing)return;
  const sel=selectedId&&state.objects[selectedId];
  if((e.key==='Delete'||e.key==='Backspace')&&sel){e.preventDefault();removeObject(sel);toastMsg('已删除');return;}
  if(e.key==='Enter'&&sel){e.preventDefault();openEditor(sel);return;}
  if(e.key==='Escape'){select(null);return;}
  if(e.key.startsWith('Arrow')&&sel){
    e.preventDefault();
    const step=e.shiftKey?10:1;
    const dx=e.key==='ArrowLeft'?-step:e.key==='ArrowRight'?step:0;
    const dy=e.key==='ArrowUp'?-step:e.key==='ArrowDown'?step:0;
    const patch={x:sel.x+dx,y:sel.y+dy};
    if(sel.type==='line'){patch.x2=sel.x2+dx;patch.y2=sel.y2+dy;}
    setPatch(sel,patch,'微调','nudge:'+sel.id);
    return;
  }
  const map={v:'select',n:'note',t:'text',r:'rect',c:'circle',l:'line'};
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&map[e.key.toLowerCase()])setTool(map[e.key.toLowerCase()]);
});

/* ================= 工具栏 ================= */
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
document.querySelectorAll('.color button').forEach(b=>b.addEventListener('click',()=>{
  noteColor=b.dataset.c;
  document.querySelectorAll('.color button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
}));
$('#undoBtn').addEventListener('click',undo);
$('#redoBtn').addEventListener('click',redo);
$('#copyBtn').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(location.href);}
  catch(e){const t=document.createElement('textarea');t.value=location.href;document.body.append(t);t.select();document.execCommand('copy');t.remove();}
  toastMsg('房间链接已复制：'+roomId);
});
$('#newRoomBtn').addEventListener('click',()=>{location.hash='room='+roomCode();});
$('#exportBtn').addEventListener('click',()=>exportPNG());

/* ================= PNG 导出（仅画布内容，不含工具栏） ================= */
function contentBBox(){
  const objs=state.order.map(id=>state.objects[id]).filter(Boolean);
  if(!objs.length)return{x:0,y:0,w:1200,h:800};
  let x0=1/0,y0=1/0,x1=-1/0,y1=-1/0;
  for(const o of objs){const b=objBBox(o);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);}
  const pad=40;
  return{x:Math.max(0,x0-pad),y:Math.max(0,y0-pad),
         w:Math.min(WORLD.w,x1+pad)-Math.max(0,x0-pad),
         h:Math.min(WORLD.h,y1+pad)-Math.max(0,y0-pad)};
}
function buildExportSVG(){
  const b=contentBBox();
  const c=svg.cloneNode(true);
  c.querySelector('#selLayer').textContent='';
  c.querySelector('#previewLayer').textContent='';
  c.setAttribute('viewBox',[b.x,b.y,b.w,b.h].join(' '));
  c.setAttribute('width',b.w);c.setAttribute('height',b.h);
  c.setAttribute('xmlns',NS);
  return{xml:new XMLSerializer().serializeToString(c),bbox:b};
}
async function exportPNG(){
  const{xml,bbox}=buildExportSVG();
  const scale=2;
  const url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));
  try{
    const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});
    const canvas=document.createElement('canvas');
    canvas.width=Math.round(bbox.w*scale);canvas.height=Math.round(bbox.h*scale);
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fbfcfd';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='canvas-room-'+roomId+'.png';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toastMsg('已导出 PNG（'+canvas.width+'×'+canvas.height+'）');
    return blob;
  }finally{URL.revokeObjectURL(url);}
}

/* ================= 跨标签页同步 ================= */
function setupSync(){
  if('BroadcastChannel' in window){
    bc=new BroadcastChannel('canvas-room-'+roomId);
    bc.onmessage=m=>{
      const d=m.data||{};
      if(d.t==='ev'){if(applyEvent(d.ev))flashSync();}
      else if(d.t==='presence'){peers.set(d.tab,Date.now());renderPresence();}
    };
  }
  window.addEventListener('storage',e=>{
    if(e.key==='sync:'+roomId&&e.newValue){
      try{const{ev}=JSON.parse(e.newValue);if(applyEvent(ev))flashSync();}catch(err){}
    }
  });
  setInterval(()=>{
    if(bc)try{bc.postMessage({t:'presence',tab:tabId});}catch(e){}
    for(const[k,t]of peers)if(Date.now()-t>6000)peers.delete(k);
    renderPresence();
  },2000);
}
function renderPresence(){$('#presence').textContent=(peers.size+1)+' 个标签页在线';}

/* ================= 初始化 ================= */
function init(){
  const m=location.hash.match(/room=([A-Za-z0-9]+)/);
  roomId=m?m[1].toUpperCase():null;
  if(!roomId){roomId=roomCode();history.replaceState(null,'','#room='+roomId);}
  $('#roomLabel').textContent=roomId;
  document.title='Canvas Room · '+roomId;
  state=loadState(roomId);
  setupSync();
  render();updateUndoUI();setTool('select');
}
window.addEventListener('hashchange',()=>location.reload());
init();

/* 测试钩子 */
window.__room={
  get state(){return state;},
  get roomId(){return roomId;},
  applyEvent,exportPNG,undo,redo,buildExportSVG,
  addTestObject:o=>addObject(o),
};
</script>
